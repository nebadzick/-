<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚡ Groq Эмоджи - Текстовый ассистент</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0a0e27 0%, #060814 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(20, 25, 45, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 48px;
            padding: 30px 25px 35px 25px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            width: 100%;
            max-width: 700px;
        }

        .badge {
            text-align: center;
            margin-bottom: 15px;
        }

        .badge span {
            background: linear-gradient(135deg, #f97316, #ef4444);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .api-status {
            background: #064e3b;
            color: #4ade80;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #22c55e;
        }

        .emoji-zone {
            text-align: center;
            margin-bottom: 15px;
        }

        .emoji-face {
            font-size: 100px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4));
            transition: transform 0.2s ease;
            display: inline-block;
        }

        .status-text {
            background: #00000066;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 8px;
            color: #e2e8f0;
        }

        /* Чат область */
        .chat-container {
            background: #0b0e14cc;
            border-radius: 28px;
            padding: 20px;
            margin: 15px 0;
            min-height: 350px;
            max-height: 450px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .user-message .message-bubble {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border-radius: 22px 22px 6px 22px;
        }

        .bot-message .message-bubble {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 22px 22px 22px 6px;
            border: 1px solid #334155;
        }

        .message-avatar {
            font-size: 28px;
            min-width: 40px;
            text-align: center;
        }

        .message-bubble {
            padding: 12px 18px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-break: break-word;
        }

        .message-time {
            font-size: 0.65rem;
            color: #64748b;
            margin-top: 4px;
            margin-left: 50px;
        }

        /* Ввод сообщения */
        .input-area {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .message-input {
            flex: 1;
            background: #0f1119;
            border: 1px solid #334155;
            padding: 14px 18px;
            border-radius: 32px;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: none;
        }

        .message-input:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 2px #f9731640;
        }

        .send-btn {
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.15s;
            color: white;
        }

        .send-btn:hover {
            transform: scale(1.02);
            background: linear-gradient(135deg, #ea580c, #c2410c);
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        .clear-btn {
            background: #334155;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #cbd5e6;
        }

        .clear-btn:hover {
            background: #475569;
        }

        .shortcut-hint {
            font-size: 0.7rem;
            color: #62748e;
            text-align: center;
            margin-top: 15px;
        }

        kbd {
            background: #0f0f1a;
            border-radius: 6px;
            padding: 3px 8px;
            font-family: monospace;
            font-weight: bold;
            color: #cbd5e6;
            border: 1px solid #3e4a66;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 16px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Скрытый временный блок для индикатора печати */
        .temp-message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">
        <span>⚡ GROQ AI • Llama 3.1 70B</span>
    </div>
    <div class="api-status" id="apiStatus">
        ✅ Groq API готов • Просто напиши сообщение
    </div>

    <div class="emoji-zone">
        <div class="emoji-face" id="emojiMain">😊</div>
        <div class="status-text" id="statusLabel">Напиши что-нибудь</div>
    </div>

    <!-- Чат -->
    <div class="chat-container" id="chatContainer">
        <div class="message bot-message">
            <div class="message-avatar">🤖</div>
            <div class="message-bubble">
                Привет! Я Groq Эмоджи 🤗<br>
                Задавай любые вопросы, я отвечаю быстро и с душой!
            </div>
        </div>
    </div>

    <!-- Поле ввода -->
    <div class="input-area">
        <textarea id="messageInput" class="message-input" placeholder="Напиши сообщение... (Enter для отправки, Shift+Enter для новой строки)" rows="1"></textarea>
        <button id="sendBtn" class="send-btn" title="Отправить">📤</button>
        <button id="clearBtn" class="clear-btn" title="Очистить чат">🗑️</button>
    </div>
    <div class="shortcut-hint">
        💡 <kbd>Enter</kbd> — отправить &nbsp;&nbsp;|&nbsp;&nbsp;
        <kbd>Shift</kbd> + <kbd>Enter</kbd> — новая строка &nbsp;&nbsp;|&nbsp;&nbsp;
        ✨ ИИ отвечает за &lt; 1 секунду
    </div>
</div>

<script>
    // ==================================================================
    // GROQ API КОНФИГУРАЦИЯ (твой ключ)
    // ==================================================================
    const GROQ_API_KEY = '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';
    const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';

    // DOM элементы
    const emojiEl = document.getElementById('emojiMain');
    const statusSpan = document.getElementById('statusLabel');
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');

    let isProcessing = false;
    let currentTypingIndicator = null;

    // ==================================================================
    // UI ФУНКЦИИ
    // ==================================================================
    function setEmoji(emoji, statusText) {
        emojiEl.innerText = emoji;
        statusSpan.innerText = statusText;
    }

    function addMessage(text, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.innerText = isUser ? '👤' : '🤖';
        
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = text.replace(/\n/g, '<br>');
        
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
        
        chatContainer.appendChild(messageDiv);
        
        // Прокрутка вниз
        chatContainer.scrollTop = chatContainer.scrollHeight;
        
        return messageDiv;
    }

    function showTypingIndicator() {
        // Удаляем предыдущий индикатор
        if (currentTypingIndicator) {
            currentTypingIndicator.remove();
        }
        
        const tempDiv = document.createElement('div');
        tempDiv.className = 'message bot-message';
        tempDiv.innerHTML = `
            <div class="message-avatar">🤖</div>
            <div class="message-bubble typing-indicator">
                <span></span><span></span><span></span>
            </div>
        `;
        chatContainer.appendChild(tempDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        currentTypingIndicator = tempDiv;
    }

    function hideTypingIndicator() {
        if (currentTypingIndicator) {
            currentTypingIndicator.remove();
            currentTypingIndicator = null;
        }
    }

    function updateEmojiByStatus() {
        if (isProcessing) {
            setEmoji('🤔', 'Думаю над ответом...');
        } else {
            setEmoji('😊', 'Готов к диалогу!');
        }
    }

    // ==================================================================
    // GROQ API ВЫЗОВ
    // ==================================================================
    async function callGroqAPI(userMessage, chatHistory) {
        try {
            const response = await fetch(GROQ_API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'llama-3.1-70b-versatile',
                    messages: [
                        {
                            role: 'system',
                            content: `Ты - дружелюбный весёлый эмоджи-ассистент. 
                            Твоя задача: общаться позитивно, с юмором и обязательно использовать эмодзи.
                            Отвечай на русском языке, кратко и по делу (2-4 предложения).
                            Твой характер: милый, заботливый, энергичный собеседник.
                            Если тебя спрашивают о делах - отвечай, что у тебя всё отлично.
                            Всегда будь доброжелательным.`
                        },
                        ...chatHistory,
                        {
                            role: 'user',
                            content: userMessage
                        }
                    ],
                    max_tokens: 200,
                    temperature: 0.85
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                console.error('Groq API Error:', errorData);
                
                if (response.status === 401) {
                    return "🔑 Ошибка: неверный API ключ Groq. Проверь ключ!";
                } else if (response.status === 429) {
                    return "⚡ Слишком много запросов! Подожди пару секунд 😅";
                }
                return `🤔 Ошибка ${response.status}. Попробуй ещё раз.`;
            }

            const data = await response.json();
            return data.choices[0].message.content;

        } catch (error) {
            console.error('Network error:', error);
            return "🌐 Ошибка сети. Проверь интернет-соединение!";
        }
    }

    // ==================================================================
    // ОТПРАВКА СООБЩЕНИЯ
    // ==================================================================
    async function sendMessage() {
        const userText = messageInput.value.trim();
        
        if (!userText) return;
        if (isProcessing) {
            addMessage("⏳ Подожди, я ещё отвечаю на предыдущий вопрос!", false);
            return;
        }
        
        // Очищаем поле ввода
        messageInput.value = '';
        messageInput.style.height = 'auto';
        
        // Показываем сообщение пользователя
        addMessage(userText, true);
        
        // Показываем индикатор печати
        showTypingIndicator();
        isProcessing = true;
        updateEmojiByStatus();
        
        // Собираем историю чата для контекста (последние 6 сообщений)
        const messages = [];
        const chatMessages = chatContainer.querySelectorAll('.message');
        // Пропускаем последний добавленный индикатор и системные сообщения
        const lastMessages = Array.from(chatMessages).slice(-10);
        for (const msg of lastMessages) {
            const bubble = msg.querySelector('.message-bubble');
            if (!bubble || bubble.classList.contains('typing-indicator')) continue;
            
            const isUserMsg = msg.classList.contains('user-message');
            const text = bubble.innerText;
            
            if (isUserMsg) {
                messages.push({ role: 'user', content: text });
            } else {
                messages.push({ role: 'assistant', content: text });
            }
        }
        // Оставляем только последние 6 для контекста
        const shortHistory = messages.slice(-6);
        
        try {
            const aiReply = await callGroqAPI(userText, shortHistory);
            hideTypingIndicator();
            addMessage(aiReply, false);
        } catch (error) {
            hideTypingIndicator();
            addMessage("😵 Упс! Что-то пошло не так. Попробуй ещё раз!", false);
        } finally {
            isProcessing = false;
            updateEmojiByStatus();
            // Фокусируемся на поле ввода
            messageInput.focus();
        }
    }

    // ==================================================================
    // ОЧИСТКА ЧАТА
    // ==================================================================
    function clearChat() {
        // Оставляем только приветственное сообщение от бота
        chatContainer.innerHTML = '';
        const welcomeMsg = document.createElement('div');
        welcomeMsg.className = 'message bot-message';
        welcomeMsg.innerHTML = `
            <div class="message-avatar">🤖</div>
            <div class="message-bubble">
                Чат очищен! 👋<br>
                Задавай любые вопросы, я готов помочь!
            </div>
        `;
        chatContainer.appendChild(welcomeMsg);
        
        if (currentTypingIndicator) {
            currentTypingIndicator.remove();
            currentTypingIndicator = null;
        }
        isProcessing = false;
        updateEmojiByStatus();
        messageInput.focus();
    }

    // ==================================================================
    // АВТОРАСШИРЕНИЕ TEXTAREA
    // ==================================================================
    function autoResizeTextarea() {
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    }

    // ==================================================================
    // ОБРАБОТЧИКИ СОБЫТИЙ
    // ==================================================================
    sendBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', clearChat);
    
    messageInput.addEventListener('input', autoResizeTextarea);
    
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Фокус на поле ввода при загрузке
    messageInput.focus();
    
    // Приветственное сообщение с эмодзи
    setEmoji('😊', 'Напиши что-нибудь');
</script>
</body>
</html>
